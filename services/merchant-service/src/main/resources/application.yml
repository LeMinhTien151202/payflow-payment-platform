spring:
  application.name: merchant-service
  datasource:
    url: ${PAYFLOW_MERCHANT_DB_URL:jdbc:postgresql://localhost:5433/payflow_merchant}
    username: ${PAYFLOW_MERCHANT_DB_USERNAME}
    password: ${PAYFLOW_MERCHANT_DB_PASSWORD}
  flyway:
    enabled: true
    schemas: merchant
    default-schema: merchant
    create-schemas: true
    locations: classpath:db/migration
  security.oauth2.resourceserver.jwt:
    issuer-uri: ${PAYFLOW_OIDC_ISSUER_URI:http://localhost:8180/realms/payflow}
    jwk-set-uri: ${PAYFLOW_OIDC_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}
server.port: ${PAYFLOW_MERCHANT_PORT:8086}
payflow.merchant:
  encryption-key-base64: ${PAYFLOW_MERCHANT_ENCRYPTION_KEY_BASE64}
  allow-unsafe-local-webhook-targets: ${PAYFLOW_WEBHOOK_ALLOW_UNSAFE_LOCAL_TARGETS:false}
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    probes.enabled: true
    show-details: never
logging:
  structured.format.console: ecs
  level.root: INFO
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
  paths-to-match: /api/v1/merchants/**
---
spring:
  config.activate.on-profile: local
  flyway.locations: classpath:db/migration,classpath:db/seed
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
