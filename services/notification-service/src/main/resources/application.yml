spring:
  application:
    name: notification-service
  datasource:
    url: ${PAYFLOW_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5433/payflow_notification}
    username: ${PAYFLOW_NOTIFICATION_DB_USERNAME}
    password: ${PAYFLOW_NOTIFICATION_DB_PASSWORD}
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_OIDC_ISSUER_URI:http://localhost:8180/realms/payflow}
          jwk-set-uri: ${PAYFLOW_OIDC_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

server:
  port: ${PAYFLOW_NOTIFICATION_PORT:8085}

payflow:
  notification-consumer:
    enabled: ${PAYFLOW_NOTIFICATION_CONSUMER_ENABLED:true}
  notification-delivery:
    enabled: ${PAYFLOW_NOTIFICATION_DELIVERY_ENABLED:true}
    poll-interval: ${PAYFLOW_NOTIFICATION_POLL_INTERVAL:500ms}
    batch-size: ${PAYFLOW_NOTIFICATION_BATCH_SIZE:50}
    lease: ${PAYFLOW_NOTIFICATION_LEASE:30s}
    provider-timeout: ${PAYFLOW_NOTIFICATION_PROVIDER_TIMEOUT:5s}
    max-attempts: ${PAYFLOW_NOTIFICATION_MAX_ATTEMPTS:5}
  webhook:
    enabled: ${PAYFLOW_WEBHOOK_ENABLED:false}
    poll-interval: ${PAYFLOW_WEBHOOK_POLL_INTERVAL:1s}
    batch-size: ${PAYFLOW_WEBHOOK_BATCH_SIZE:25}
    lease: ${PAYFLOW_WEBHOOK_LEASE:30s}
    merchant-service-uri: ${PAYFLOW_MERCHANT_SERVICE_URI:http://localhost:8086}
    token-uri: ${PAYFLOW_SERVICE_TOKEN_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/token}
    client-id: ${PAYFLOW_NOTIFICATION_CLIENT_ID:payflow-notification}
    client-secret: ${PAYFLOW_NOTIFICATION_CLIENT_SECRET:local-disabled}
    http-timeout: ${PAYFLOW_WEBHOOK_HTTP_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
  paths-to-match: /api/v1/operations/webhooks/**
---
spring:
  config.activate.on-profile: local
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
