spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. Có thể ghi đè theo môi trường; tuyệt đối không hardcode secret ở đây.
          issuer-uri: ${PAYFLOW_OIDC_ISSUER_URI:http://localhost:8180/realms/payflow}
          # Việc giữ issuer và key endpoint riêng biệt giúp cho container kiểm chứng public
          # issuer localhost trong khi vẫn tải các signing key qua mạng Compose nội bộ.
          jwk-set-uri: ${PAYFLOW_OIDC_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}

server:
  port: ${PAYFLOW_GATEWAY_PORT:8080}
  # Giới hạn dung lượng HTTP request header tại edge. AGENTS.md phần 8 yêu cầu gateway giới hạn dung lượng request.
  max-http-request-header-size: 16KB

payflow:
  gateway:
    downstream:
      payment-service: ${PAYFLOW_PAYMENT_SERVICE_URI:http://localhost:8081}
      merchant-service: ${PAYFLOW_MERCHANT_SERVICE_URI:http://localhost:8087}
      notification-service: ${PAYFLOW_NOTIFICATION_SERVICE_URI:http://localhost:8085}
      reporting-service: ${PAYFLOW_REPORTING_SERVICE_URI:http://localhost:8088}
      settlement-service: ${PAYFLOW_SETTLEMENT_SERVICE_URI:http://localhost:8089}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: Payment API
    doc-expansion: none
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: false
    urls:
      - name: Payment API
        url: /openapi/payment-service-v1.yaml
      - name: Merchant API
        url: /openapi/merchant-service-v1.yaml
      - name: Reporting API
        url: /openapi/reporting-service-v1.yaml
      - name: Webhook Operations API
        url: /openapi/notification-operations-v1.yaml
      - name: Settlement API
        url: /openapi/settlement-service-v1.yaml

management:
  endpoints:
    web:
      exposure:
        # Chỉ expose endpoint health. Việc mở rộng thêm cần được security review, không phải một tinh chỉnh config đơn thuần.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      # Log định dạng đọc bởi máy (machine-readable) để correlationId là một field có thể query thay vì text tự do.
      console: ecs
  level:
    root: INFO
