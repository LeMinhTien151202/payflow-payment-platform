spring:
  application:
    name: payment-service

  datasource:
    # Credentials chỉ đến từ môi trường. AGENTS.md phần 8 cấm việc commit bất kỳ
    # credential nào, nên không có mật khẩu mặc định (fallback) ở đây.
    url: ${PAYFLOW_PAYMENT_DB_URL:jdbc:postgresql://localhost:5433/payflow_payment}
    username: ${PAYFLOW_PAYMENT_DB_USERNAME}
    password: ${PAYFLOW_PAYMENT_DB_PASSWORD}

  jpa:
    hibernate:
      # Flyway sở hữu schema. Hibernate tuyệt đối không được tự thay đổi nó.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Cả hai schema đều thuộc sở hữu của service này và không có service nào khác được quyền ghi vào một trong hai. `merchant`
    # tách biệt vì merchant catalog dự kiến sẽ trở thành service riêng (xem V2__payment_intake.sql);
    # cho đến lúc đó, một bảng lịch sử Flyway trong `payment` sẽ quản lý cả hai.
    schemas: payment,merchant
    default-schema: payment
    create-schemas: true
    # Seed data không nằm ở đây. Nó được thêm bởi profile `local` bên dưới, để không môi trường nào bị nạp nhầm
    # do vô tình quên trừ nó ra.
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_OIDC_ISSUER_URI:http://localhost:8180/realms/payflow}
          jwk-set-uri: ${PAYFLOW_OIDC_JWK_SET_URI:http://localhost:8180/realms/payflow/protocol/openid-connect/certs}

  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${PAYFLOW_KAFKA_DELIVERY_TIMEOUT_MS:60000}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PAYFLOW_PAYMENT_PORT:8081}

# Tài liệu API được cố ý tắt theo mặc định. Profile local bên dưới sẽ mở nó cho
# các nhà phát triển; một profile giống production không được phép rò rỉ metadata triển khai do vô tình.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/payments/**

payflow:
  outbox:
    enabled: ${PAYFLOW_OUTBOX_ENABLED:true}
    poll-interval: ${PAYFLOW_OUTBOX_POLL_INTERVAL:500ms}
    batch-size: ${PAYFLOW_OUTBOX_BATCH_SIZE:100}
    lease: ${PAYFLOW_OUTBOX_LEASE:120s}
    max-attempts: ${PAYFLOW_OUTBOX_MAX_ATTEMPTS:10}
    max-backoff: ${PAYFLOW_OUTBOX_MAX_BACKOFF:300s}
    # Ghim vào cùng một giá trị biến môi trường với thuộc tính producer của Kafka. Giá trị đơn lẻ này giúp ngăn chặn
    # lease guard và network timeout thực tế không bị mâu thuẫn âm thầm với nhau.
    delivery-timeout: ${PAYFLOW_KAFKA_DELIVERY_TIMEOUT_MS:60000}ms
  saga-recovery:
    enabled: ${PAYFLOW_SAGA_RECOVERY_ENABLED:true}
    poll-interval: ${PAYFLOW_SAGA_RECOVERY_POLL_INTERVAL:1s}
    step-timeout: ${PAYFLOW_SAGA_STEP_TIMEOUT:30s}
    max-retries: ${PAYFLOW_SAGA_MAX_RETRIES:3}
    batch-size: ${PAYFLOW_SAGA_RECOVERY_BATCH_SIZE:50}
  workflow-consumer:
    enabled: ${PAYFLOW_WORKFLOW_CONSUMER_ENABLED:true}
    retry-backoff: ${PAYFLOW_WORKFLOW_CONSUMER_RETRY_BACKOFF:1s}
    max-retries: ${PAYFLOW_WORKFLOW_CONSUMER_MAX_RETRIES:3}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Readiness phải báo lỗi khi database không thể kết nối tới, nếu không service sẽ chấp nhận
    # lưu lượng truy cập mà nó không thể xử lý. Đây là gate Phase 0 về tính sẵn sàng thực sự.
    db:
      enabled: true
    readiness-state:
      enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

---
# Dành riêng cho Local development.
#
# DATABASE_RULES.md phần 15.3 cho phép seed data trong các profile `local` và `test` và không ở đâu khác.
# Việc biến nó thành một profile override thay vì mặc định có nghĩa là đợt deploy chỉ nạp seed khi ai đó
# chủ động yêu cầu profile `local`, thay vì chỉ khi có ai đó nhớ việc tắt nó đi.
#
# Seed data là một Flyway afterMigrate callback, chứ không phải một migration có version: nó tuyệt đối không được chiếm một số version
# mà các môi trường khác sau đó sẽ bị thiếu trong lịch sử của chúng.
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    document-title: PayFlow Payment API
