spring:
  application:
    name: account-ledger-service
  datasource:
    url: ${PAYFLOW_ACCOUNT_LEDGER_DB_URL:jdbc:postgresql://localhost:5432/payflow_account_ledger}
    username: ${PAYFLOW_ACCOUNT_LEDGER_DB_USERNAME}
    password: ${PAYFLOW_ACCOUNT_LEDGER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: account_ledger,account,ledger
    default-schema: account_ledger
    create-schemas: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYFLOW_OIDC_ISSUER_URI:http://localhost:8180/realms/payflow}
  kafka:
    bootstrap-servers: ${PAYFLOW_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${PAYFLOW_KAFKA_DELIVERY_TIMEOUT_MS:30000}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate

server:
  port: ${PAYFLOW_ACCOUNT_LEDGER_PORT:8082}

payflow:
  refund-consumer:
    enabled: ${PAYFLOW_REFUND_CONSUMER_ENABLED:true}
  outbox:
    enabled: ${PAYFLOW_OUTBOX_ENABLED:true}
    poll-interval: ${PAYFLOW_OUTBOX_POLL_INTERVAL:500ms}
    batch-size: ${PAYFLOW_OUTBOX_BATCH_SIZE:100}
    lease: ${PAYFLOW_OUTBOX_LEASE:120s}
    max-attempts: ${PAYFLOW_OUTBOX_MAX_ATTEMPTS:10}
    max-backoff: ${PAYFLOW_OUTBOX_MAX_BACKOFF:300s}
    delivery-timeout: ${PAYFLOW_KAFKA_DELIVERY_TIMEOUT_MS:30000}ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
