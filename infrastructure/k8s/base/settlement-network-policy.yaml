apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: settlement-service-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: settlement-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: api-gateway}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports:
        - {protocol: TCP, port: 8089}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: payflow-data}}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 9092}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports:
        - {protocol: TCP, port: 4318}
