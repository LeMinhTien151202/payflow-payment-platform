apiVersion: v1
kind: ServiceAccount
metadata:
  name: settlement-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-service
data:
  SPRING_PROFILES_ACTIVE: kubernetes
  PAYFLOW_SETTLEMENT_PORT: "8089"
  PAYFLOW_SETTLEMENT_BUSINESS_ZONE: Asia/Ho_Chi_Minh
  PAYFLOW_SETTLEMENT_CONSUMER_ENABLED: "true"
  PAYFLOW_OUTBOX_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  labels: &labels
    app.kubernetes.io/name: settlement-service
    app.kubernetes.io/part-of: payflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-service
  template:
    metadata:
      labels: *labels
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8089"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: settlement-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: settlement-service
          image: ghcr.io/example/payflow/settlement-service:replace-with-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8089}
          envFrom:
            - configMapRef: {name: settlement-service}
            - secretRef: {name: settlement-service-runtime}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
spec:
  selector:
    app.kubernetes.io/name: settlement-service
  ports:
    - {name: http, port: 8089, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: settlement-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: settlement-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: settlement-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: settlement-service}
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
