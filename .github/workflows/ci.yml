# PayFlow CI — Phase 0 skeleton.
#
# Hai job, được chia theo cùng một cách mà build local được chia, để khi có lỗi xảy ra bạn sẽ biết ngay nhóm
# vấn đề bạn đang gặp phải:
#
#   fast-tests  — compile + Surefire. Không dùng Docker. Phải giữ tốc độ đủ nhanh để gate cho mỗi đợt push.
#   verify      — gate thực sự: bao gồm cả Failsafe và các bài test chạy trên Testcontainers.
#
# Job `verify` là thứ giúp cho tuyên bố `VERIFIED_CI` trong .docs/IMPLEMENTATION_STATUS.md trở nên khả thi.
# Không thêm `-Pno-docker` vào job này: các runner ubuntu của GitHub cung cấp sẵn Docker daemon, nên không có
# lý do gì để bỏ qua container test trong CI, và việc bỏ qua chúng sẽ khiến badge trở nên vô nghĩa.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Một lượt push mới vào cùng một branch sẽ hủy bỏ lượt chạy trước đó. Hai lượt chạy cùng một phạm vi commit không chứng minh
# thêm được điều gì và job Testcontainers là job tốn kém tài nguyên.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Giữ Maven yên lặng về tiến trình tải xuống; log được đọc bởi con người khi tìm kiếm lỗi.
  MAVEN_ARGS: -B -ntp

jobs:
  fast-tests:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # Phải khớp với toolchain trong parent POM. ADR-013 khóa cố định Java 21.
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure the Maven wrapper is executable
        # Repository được khởi tạo trên Windows, nơi git không ghi nhận được quyền thực thi (exec bit) trừ khi nó được
        # đặt tường minh (`git update-index --chmod=+x mvnw`). Nếu không có lệnh này, `./mvnw` sẽ thất bại trên
        # Linux runner với lỗi "Permission denied" và lỗi đó không phản ánh đúng nguyên nhân gây ra nó.
        run: chmod +x ./mvnw

      - name: Compile and run unit and slice tests
        run: ./mvnw $MAVEN_ARGS clean test

      - name: Upload Surefire reports
        # Báo cáo quan trọng nhất khi bước trên thất bại, nên bước này tuyệt đối không được bỏ qua khi có lỗi.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
          retention-days: 7

  verify:
    name: Full verify with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Chạy tuần tự theo thiết kế: nếu code không biên dịch được hoặc một unit test bị hỏng, việc tiêu tốn thời gian
    # chạy container trên runner sẽ không mang lại thông tin gì mới.
    needs: fast-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Ensure the Maven wrapper is executable
        run: chmod +x ./mvnw

      - name: Confirm a Docker daemon is available
        # Báo lỗi rõ ràng tại đây thay vì để Testcontainers thất bại sau đó với một thông điệp trông
        # như một lỗi của bài test. Nếu bước này thất bại, nghĩa là image runner đã thay đổi chứ không phải do code.
        run: docker version

      - name: Run the full gate
        run: ./mvnw $MAVEN_ARGS clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  compose-config:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file interpolation
        # --env-file .env.example, tuyệt đối không dùng .env thật: điều này chứng minh template được commit đã đủ
        # hoàn thiện để render ra file. Lệnh này không khởi động bất kỳ dịch vụ nào.
        run: |
          docker compose --env-file .env.example --profile infra config --quiet
          docker compose --env-file .env.example --profile mvp config --quiet
          test "$(docker compose --env-file .env.example --profile mvp config --services | wc -l)" -eq 10

