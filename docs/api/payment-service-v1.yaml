openapi: 3.1.0
info:
  title: PayFlow Payment Service API
  version: 1.0.0
  description: >-
    Public contract for asynchronous payment/refund intake and payment status reads.
    A 202 response means the command and its outbox event were durably accepted; it does not mean
    the financial workflow has already succeeded. Poll GET /api/v1/payments/{paymentId} for outcome.
servers:
  - url: http://localhost:8084
    description: Local API Gateway

security:
  - bearerAuth: []
paths:
  /api/v1/payments:
    get:
      operationId: searchPayments
      summary: Search payments owned by the authenticated merchant
      description: >-
        Returns a bounded newest-first page. merchant_id is always taken from the JWT. The optional
        time range is half-open: from is inclusive and to is exclusive. This read emits no Kafka event.
      parameters:
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/PaymentStatus'}
        - name: from
          in: query
          required: false
          description: Inclusive createdAt lower bound
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          description: Exclusive createdAt upper bound
          schema: {type: string, format: date-time}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Merchant-scoped payment page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentSearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createPayment
      summary: Accept a payment for asynchronous processing
      description: >-
        Creates the merchant-owned payment, idempotency record, Saga and payment.created outbox row
        atomically. Risk, balance reservation, ledger posting and capture continue through Kafka.
        Replay the same body with the same Idempotency-Key safely; poll GET with the returned ID.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '202':
          description: New payment accepted or an identical idempotent request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAcceptanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Read one payment visible to the authenticated merchant
      description: >-
        Returns the current Saga-derived payment state. This read emits no Kafka event and is the
        polling endpoint after create returned 202.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Merchant-owned payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Payment absent or owned by another merchant
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/payments/{paymentId}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment before funds reservation starts
      description: >-
        Atomically moves the merchant-owned Payment and its Saga to CANCELLED while risk is still
        the active step. No balance has been reserved at that point. A late risk response is stored
        in the inbox and ignored, while an impossible late financial event remains an error. Reusing
        the same Idempotency-Key for the same payment replays the original 200 response.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Payment cancelled, or an identical cancellation replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaymentAcceptanceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Payment absent or owned by another merchant
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '409':
          description: Reservation has started, or the idempotency key represents another request
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
  /api/v1/payments/{paymentId}/refunds:
    post:
      operationId: createRefund
      summary: Reserve refundable capacity and accept asynchronous refund processing
      description: >-
        Locks the merchant-owned payment, reserves refundable capacity and writes refund.requested
        through the outbox. Ledger posting and account credit continue asynchronously through Kafka.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRefundRequest'}
      responses:
        '202':
          description: Capacity reserved; new refund accepted or identical request replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundAcceptanceResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Payment absent or owned by another merchant
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/payments/{paymentId}/refunds/{refundId}:
    get:
      operationId: getRefund
      summary: Read one refund of a merchant-owned payment
      description: >-
        refundId, parent paymentId and merchant_id from the JWT must all match. Missing and
        cross-merchant data return the same 404. This read emits no Kafka event.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: refundId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Current merchant-owned refund state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundDetailResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Refund absent or not visible to this merchant
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
  /api/v1/operations/payments/manual-review:
    get:
      operationId: searchPaymentManualReviews
      summary: List Payment Sagas waiting for an operations decision
      description: >-
        Requires operations:write. Returns only safe financial workflow facts, ordered by longest
        waiting first. Customer metadata is excluded. This read takes no Saga lock and emits no event.
      parameters:
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Oldest-first manual-review queue
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManualReviewSearchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/operations/payments/{paymentId}/manual-review/resolve:
    post:
      operationId: resolvePaymentManualReview
      summary: Resolve one stopped Payment Saga through an audited operations decision
      description: >-
        Requires operations:write and does not accept merchant credentials. Payment/Saga state,
        the next outbox command and a typed append-only audit record commit atomically. Risk review
        accepts APPROVE_RISK or REJECT_RISK; financial steps accept RETRY_CURRENT_STEP. This endpoint
        never accepts a free-form note, JWT content, webhook secret or arbitrary audit JSON.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResolveManualReviewRequest'}
      responses:
        '200':
          description: Resolution, next command and audit record committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManualReviewResolutionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: Manual-review work item not found
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetails'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 100
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
  schemas:
    CreatePaymentRequest:
      type: object
      required: [merchantReference, customerId, sourceAccountId, amount, currency]
      properties:
        merchantReference:
          type: string
          minLength: 1
          maxLength: 100
        customerId:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          examples: [VND]
        description:
          type: [string, 'null']
          maxLength: 500
        metadata:
          type: [object, 'null']
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 512
    PaymentAcceptance:
      type: object
      required: [paymentId, status, amount, currency, createdAt]
      properties:
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [CREATED]}
        amount: {type: number}
        currency: {type: string}
        createdAt: {type: string, format: date-time}
    CreateRefundRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
        reason:
          type: [string, 'null']
          maxLength: 500
    RefundAcceptance:
      type: object
      required: [refundId, paymentId, status, amount, currency, createdAt]
      properties:
        refundId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        status: {type: string, enum: [CREATED]}
        amount: {type: number}
        currency: {type: string, enum: [VND]}
        createdAt: {type: string, format: date-time}
    RefundDetail:
      type: object
      required: [refundId, paymentId, amount, currency, status, createdAt, updatedAt]
      properties:
        refundId: {type: string, format: uuid}
        paymentId: {type: string, format: uuid}
        amount: {type: number}
        currency: {type: string, enum: [VND]}
        status: {type: string, enum: [CREATED, PROCESSING, SUCCEEDED, FAILED]}
        reason: {type: [string, 'null']}
        ledgerJournalId: {type: [string, 'null'], format: uuid}
        accountCreditId: {type: [string, 'null'], format: uuid}
        feeReversalAmount: {type: [number, 'null']}
        failureCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
    ResolveManualReviewRequest:
      type: object
      required: [decision, decisionCode]
      properties:
        decision:
          type: string
          enum: [APPROVE_RISK, REJECT_RISK, RETRY_CURRENT_STEP]
        decisionCode:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{0,99}$'
          description: Stable allowlisted decision code, never a free-form note
    ManualReviewResolutionResult:
      type: object
      required: [paymentId, paymentStatus, sagaStatus, sagaStep, commandEventId, resolvedAt]
      properties:
        paymentId: {type: string, format: uuid}
        paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
        sagaStatus:
          type: string
          enum: [RUNNING, COMPENSATING, COMPLETED, COMPENSATED, FAILED, MANUAL_REVIEW_REQUIRED, CANCELLED]
        sagaStep:
          type: string
          enum: [RISK_ASSESSMENT, RESERVE_FUNDS, POST_LEDGER, CAPTURE_FUNDS, RELEASE_FUNDS, COMPLETED]
        commandEventId: {type: string, format: uuid}
        resolvedAt: {type: string, format: date-time}
    ManualReviewItem:
      type: object
      required:
        [paymentId, merchantId, amount, currency, currentStep, retryCount, waitingSince]
      properties:
        paymentId: {type: string, format: uuid}
        merchantId: {type: string, format: uuid}
        amount: {type: number}
        currency: {type: string}
        currentStep:
          type: string
          enum: [RISK_ASSESSMENT, RESERVE_FUNDS, POST_LEDGER, CAPTURE_FUNDS, RELEASE_FUNDS]
        retryCount: {type: integer, minimum: 0}
        lastErrorCode: {type: [string, 'null']}
        reservationId: {type: [string, 'null'], format: uuid}
        journalId: {type: [string, 'null'], format: uuid}
        waitingSince: {type: string, format: date-time}
    ManualReviewSearchResult:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ManualReviewItem'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    PaymentDetail:
      type: object
      required:
        [paymentId, merchantId, merchantReference, customerId, sourceAccountId,
         amount, currency, status, createdAt, updatedAt]
      properties:
        paymentId: {type: string, format: uuid}
        merchantId: {type: string, format: uuid}
        merchantReference: {type: string}
        customerId: {type: string, format: uuid}
        sourceAccountId: {type: string, format: uuid}
        amount: {type: number}
        currency: {type: string}
        status:
          type: string
          enum:
            [CREATED, RISK_CHECKING, RISK_REJECTED, RESERVING_FUNDS, PROCESSING,
             MANUAL_REVIEW_REQUIRED, SUCCEEDED, FAILED, CANCELLED,
             PARTIALLY_REFUNDED, REFUNDED]
        description: {type: [string, 'null']}
        metadata: {type: object, additionalProperties: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PaymentStatus:
      type: string
      enum:
        [CREATED, RISK_CHECKING, RISK_REJECTED, RESERVING_FUNDS, PROCESSING,
         MANUAL_REVIEW_REQUIRED, SUCCEEDED, FAILED, CANCELLED,
         PARTIALLY_REFUNDED, REFUNDED]
    PaymentSearchResult:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PaymentDetail'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    ResponseMeta:
      type: object
      required: [correlationId, timestamp]
      properties:
        correlationId: {type: string}
        timestamp: {type: string, format: date-time}
    PaymentAcceptanceResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PaymentAcceptance'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PaymentDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PaymentDetail'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    PaymentSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/PaymentSearchResult'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    RefundAcceptanceResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/RefundAcceptance'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    RefundDetailResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/RefundDetail'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ManualReviewResolutionResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ManualReviewResolutionResult'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    ManualReviewSearchResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/ManualReviewSearchResult'}
        meta: {$ref: '#/components/schemas/ResponseMeta'}
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: {type: string}
        message: {type: string}
    ProblemDetails:
      type: object
      required: [status, code, detail, timestamp, fieldErrors]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        correlationId: {type: string}
        timestamp: {type: string, format: date-time}
        fieldErrors:
          type: array
          items: {$ref: '#/components/schemas/FieldViolation'}
  responses:
    BadRequest:
      description: Validation or idempotency header error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Unauthenticated:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Forbidden:
      description: Missing scope or merchant identity
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Conflict:
      description: Duplicate reference, refund capacity/state conflict, or idempotency conflict
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
